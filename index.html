<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>CineWave - Experiencia Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #E50914;
            --bg-deep: #050505;
            --premium-bezier: cubic-bezier(0.16, 1, 0.3, 1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: white;
            margin: 0;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }
        
        /* Custom Smooth Scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Scrollbar refined */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: background 0.3s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Premium Animations */
        @keyframes revealItem {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-reveal {
            animation: revealItem 0.8s var(--premium-bezier) forwards;
        }

        .glass-premium {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Mask for smooth edge fading on rows */
        .row-mask {
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        
        /* Card Glow Effect */
        .card-glow:hover {
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.2);
            border-color: rgba(229, 9, 20, 0.4);
        }
    </style>
